<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="PhoneCast logo">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a9dff"/>
      <stop offset="1" stop-color="#0866d6"/>
    </linearGradient>
  </defs>
  <!-- the tile -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#tile)"/>
  <!-- the phone -->
  <rect x="112" y="100" width="172" height="312" rx="38" fill="none" stroke="#ffffff" stroke-width="28"/>
  <rect x="172" y="138" width="52" height="14" rx="7" fill="#ffffff"/>
  <!-- its screen, cast out to the side -->
  <path d="M 314 206 A 62 62 0 0 1 314 306" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round"/>
  <path d="M 348 152 A 128 128 0 0 1 348 360" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" opacity="0.75"/>
</svg>
